<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PDF Flipbook</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #333; /* Arka planı koyu yaparak sayfayı öne çıkardık */
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #flipbook-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .page {
      background-color: white;
      overflow: hidden;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div id="flipbook-container">
    <div id="flipbook"></div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    const pdfUrl = 'dosya.pdf'; // PDF yolunuz

    async function renderPDF() {
      const loadingTask = pdfjsLib.getDocument(pdfUrl);
      const pdf = await loadingTask.promise;
      const flipbookContainer = document.getElementById('flipbook');

      // İlk sayfanın orijinal en/boy oranını al
      const samplePage = await pdf.getPage(1);
      const sampleViewport = samplePage.getViewport({ scale: 1 });
      const aspectRatio = sampleViewport.width / sampleViewport.height;

      // Ekran boyutlarını al
      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;
      const isMobile = screenWidth < 768; // Mobil kontrolü

      // Sayfa boyutlarını ekrana tam sığacak şekilde hesapla
      let bookHeight = screenHeight * 0.95;
      let bookWidth = bookHeight * aspectRatio;

      // Eğer hesaplanan genişlik ekrandan taşarsa genişliğe göre ayarla
      const maxWidth = isMobile ? screenWidth * 0.95 : (screenWidth * 0.95) / 2;
      if (bookWidth > maxWidth) {
        bookWidth = maxWidth;
        bookHeight = bookWidth / aspectRatio;
      }

      // Sayfaları oluştur
      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        
        // Yüksek çözünürlük için scale 2
        const viewport = page.getViewport({ scale: 2 });

        const pageDiv = document.createElement('div');
        pageDiv.className = 'page';

        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        pageDiv.appendChild(canvas);
        flipbookContainer.appendChild(pageDiv);

        await page.render({
          canvasContext: context,
          viewport: viewport
        }).promise;
      }

      // Flipbook ayarları
      const pageFlip = new St.PageFlip(flipbookContainer, {
        width: Math.floor(bookWidth),
        height: Math.floor(bookHeight),
        size: "fixed",
        showCover: true,
        usePortrait: isMobile, // Mobilde dikey modda TEK SAYFA gösterir
        startPage: 0,
        drawShadow: true,
        maxShadowOpacity: 0.3
      });

      pageFlip.loadFromHTML(document.querySelectorAll('.page'));
    }

    renderPDF();
  </script>
</body>
</html>
