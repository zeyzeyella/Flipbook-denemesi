<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Flipbook - Ekrana Sığdırılmış</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden; /* Taşma ve kaydırma çubuklarını engeller */
    }
    #flipbook-wrapper {
      width: 95vw;  /* Ekranın %95 genişliği */
      height: 95vh; /* Ekranın %95 yüksekliği */
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .page {
      background-color: white;
    }
    canvas {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="flipbook-wrapper">
    <div id="flipbook"></div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    const pdfUrl = 'dosya.pdf'; // PDF dosya yolunuz

    async function renderPDF() {
      const loadingTask = pdfjsLib.getDocument(pdfUrl);
      const pdf = await loadingTask.promise;
      const flipbookContainer = document.getElementById('flipbook');

      // 1. Ekran boyutlarına göre dinamik sayfa boyutu hesaplama
      const wrapper = document.getElementById('flipbook-wrapper');
      const containerWidth = wrapper.clientWidth;
      const containerHeight = wrapper.clientHeight;

      // Çift sayfa açılacağı için sayfa genişliği alanın yarısı kadar hesaplanır
      const calculatedWidth = Math.floor(containerWidth / 2);
      const calculatedHeight = containerHeight;

      // 2. Yüksek kaliteli render için PDF sayfalarını çizme
      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const viewport = page.getViewport({ scale: 2 }); // Net görünüm için 2.0 ölçek

        const pageDiv = document.createElement('div');
        pageDiv.className = 'page';

        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        pageDiv.appendChild(canvas);
        flipbookContainer.appendChild(pageDiv);

        await page.render({
          canvasContext: context,
          viewport: viewport
        }).promise;
      }

      // 3. Flipbook'u ekran boyutuna göre başlatma
      const pageFlip = new St.PageFlip(flipbookContainer, {
        width: calculatedWidth,
        height: calculatedHeight,
        size: "stretch",          // Esnek boyutlandırma
        minWidth: 200,
        maxWidth: 2000,
        minHeight: 300,
        maxHeight: 2000,
        maxShadowOpacity: 0.5,
        showCover: true
      });

      pageFlip.loadFromHTML(document.querySelectorAll('.page'));
    }

    renderPDF();
  </script>
</body>
</html>
